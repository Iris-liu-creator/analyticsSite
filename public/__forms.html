<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Netlify Forms</title>
  </head>
  <body>
    <form name="contact" method="POST" data-netlify="true" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="name" type="text" />
      <input name="workEmail" type="email" />
      <input name="companyOrganisation" type="text" />
      <select name="topic">
        <option>Analytics support / Service package enquiry</option>
        <option>BI consultation</option>
        <option>Analytics collaboration</option>
        <option>Project evaluation &amp; discussion</option>
        <option>Data pipeline design &amp; setup support</option>
        <option>Others, detail below</option>
      </select>
      <textarea name="message"></textarea>
    </form>

    <form name="services-inquiry" method="POST" data-netlify="true" hidden>
      <input type="hidden" name="form-name" value="services-inquiry" />
      <input name="name" type="text" />
      <input name="companyEmail" type="email" />
      <input name="companyName" type="text" />
      <textarea name="currentChallenge"></textarea>
      <select name="budgetRange">
        <option>Not sure yet</option>
        <option>Under AUD $2,000</option>
        <option>AUD $2,000 - $5,000</option>
        <option>AUD $5,000 - $10,000</option>
        <option>AUD $10,000+</option>
      </select>
      <select name="preferredTimeline">
        <option>ASAP</option>
        <option>Within 1 month</option>
        <option>1-3 months</option>
        <option>3+ months</option>
        <option>Exploring only</option>
      </select>
      <input name="requestDemo" type="checkbox" />
    </form>
  </body>
</html>
