<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Beyond Flashy Dashboards: Building Trustworthy AI Reporting Workflows</title>
  <desc id="desc">A simplified governed AI reporting flow chart with five quiet process stages and a governance foundation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.58" stop-color="#ecfeff"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-15%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#0f172a" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1018" cy="106" r="124" fill="#dbeafe" opacity="0.78"/>
  <circle cx="1010" cy="548" r="182" fill="#ccfbf1" opacity="0.58"/>
  <circle cx="126" cy="552" r="170" fill="#dbeafe" opacity="0.5"/>

  <g transform="translate(82 76)">
    <text x="0" y="0" dominant-baseline="hanging" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#071a3d">Beyond Flashy Dashboards</text>
    <text x="0" y="50" dominant-baseline="hanging" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#071a3d">Trustworthy AI Reporting Workflows</text>
  </g>

  <g transform="translate(82 246)" filter="url(#softShadow)">
    <rect x="0" y="0" width="1036" height="328" rx="34" fill="#ffffff" stroke="#d8e2ef" stroke-width="2"/>

    <line x1="132" y1="122" x2="904" y2="122" stroke="#dbeafe" stroke-width="10" stroke-linecap="round"/>
    <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
      <rect x="46" y="62" width="150" height="120" rx="26" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="121" y="124" dominant-baseline="middle" font-size="18" font-weight="600" fill="#071a3d">Data</text>

      <rect x="249.5" y="62" width="150" height="120" rx="26" fill="#f0fdfa" stroke="#99f6e4"/>
      <text x="324.5" y="116" font-size="18" font-weight="600" fill="#071a3d">
        <tspan x="324.5" y="116">Certified</tspan>
        <tspan x="324.5" y="140">Model</tspan>
      </text>

      <rect x="453" y="62" width="150" height="120" rx="26" fill="#eef2ff" stroke="#c7d2fe"/>
      <text x="528" y="124" dominant-baseline="middle" font-size="18" font-weight="600" fill="#071a3d">AI Draft</text>

      <rect x="656.5" y="62" width="150" height="120" rx="26" fill="#ffffff" stroke="#d8e2ef"/>
      <text x="731.5" y="116" font-size="18" font-weight="600" fill="#071a3d">
        <tspan x="731.5" y="116">Human</tspan>
        <tspan x="731.5" y="140">Review</tspan>
      </text>

      <rect x="860" y="62" width="150" height="120" rx="26" fill="#f8fafc" stroke="#d8e2ef"/>
      <text x="935" y="124" dominant-baseline="middle" font-size="18" font-weight="600" fill="#071a3d">Delivery</text>
    </g>

    <rect x="46" y="224" width="964" height="62" rx="22" fill="#0f172a"/>
    <text x="528" y="263" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#ffffff">Governance Foundation</text>
  </g>
</svg>
